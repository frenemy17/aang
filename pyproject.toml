[project]
name = "aang-ai"
version = "0.1.0"
description = "Aang — Autonomous Terminal Coding Agent & SWE-Bench Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "docker>=7.0.0",
    "requests>=2.31.0"
]

[project.scripts]
aang = "aang.main:main"

[project.urls]
Homepage = "https://github.com/frenemy17/aang"
Repository = "https://github.com/frenemy17/aang.git"
Issues = "https://github.com/frenemy17/aang/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aang"]
